name: Showrunner
description: >-
  Showrunner is an AI streaming and animation platform built by Fable Simulation
  (founded by Edward Saatchi) and billed as the "Netflix of AI." It lets users
  create and watch AI-generated serialized animated television shows across
  genres, acting as directors to write, produce, voice, and remix full episodes
  within simulated worlds such as Sim Francisco, alongside flagship series like
  Exit Valley. The platform is powered by Fable's proprietary SHOW-2 model and is
  delivered as a consumer iOS app and Discord community. Showrunner publishes no
  first-party developer API; its public site is a Wix-hosted marketing property
  that exposes the standard Wix Site MCP endpoint for agentic access to public
  site content.
